# The Mac can't report its own death. Twice a day, about 3 hours after each run (07:00 and 19:00 Toronto),
# check that a run committed in the last 8 hours; if not, push an alert to the phone. One missed run is
# enough to alert (D57: a stuck run went unnoticed for 36 hours on 19–20 Nov).
name: watchdog
on:
  schedule:
    - cron: "0 15 * * *"   # 10:00 Toronto (EST), 11:00 (EDT)
    - cron: "0 3 * * *"    # 22:00 Toronto (EST), 23:00 (EDT)
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check last run time
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'fmz_pricing_desk' }}
        run: |
          python3 - <<'PY'
          import json, os, datetime as dt, urllib.request
          meta = json.load(open("data/meta.json"))
          if not meta.get("last_run_at"):
              raise SystemExit("no run yet; nothing to check")
          last = dt.datetime.fromisoformat(meta["last_run_at"])
          age = dt.datetime.now(dt.timezone.utc) - last
          print(f"last run {last}, {age} ago")
          if age > dt.timedelta(hours=8):
              msg = (f"No Pricing Desk run since {last:%a %d %b %H:%M}. On the Mac mini: launchctl list | grep "
                     "pricing_desk. A number in the first column = a run is stuck (RUNBOOK); '-' = check power, "
                     "login, network.")
              req = urllib.request.Request(f"https://ntfy.sh/{os.environ['NTFY_TOPIC']}", data=msg.encode(),
                  headers={"Title": "Pricing Desk: Mac mini silent", "Priority": "high", "Tags": "warning"})
              urllib.request.urlopen(req, timeout=20)
          PY
